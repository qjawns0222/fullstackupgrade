jwt:
  secret: DisIsVerySecretKeyForJwtExampleProjectMustBeLongerThan256BitsVoila

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, circuitbreakers, flyway, sessions
  health:
    circuitbreakers:
      enabled: true
    ratemiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      s3Service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      ocrService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      s3Service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

  bulkhead:
    instances:
      ocrService:
        maxConcurrentCalls: 3
        maxWaitDuration: 2s

aws:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: aiblog-bucket
    
  tracing:
    sampling:
      probability: 1.0
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

cache:
  two-level:
    l1-max-size: 200
    l1-ttl-seconds: 30
    l2-ttl-seconds: 300
    invalidation-topic: cache:invalidation
    cache-names:
      - dashboard
      - jobApplications
      - resumeList
      - trendStats

org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: true
      port: 8000

