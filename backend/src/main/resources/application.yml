spring:
  messages:
    encoding: UTF-8
    always-use-message-format: true
  application:
    name: demo
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls
  

  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/study_db?serverTimezone=UTC&characterEncoding=UTF-8
    username: root     # DB 아이디
    password: root     # DB 비밀번호
  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema
    properties:
      hibernate:
        format_sql: true # SQL 예쁘게 출력
        show_sql: true   # SQL 로그에 
  flyway:
    enabled: true
    baseline-on-migrate: true 
  batch:
    jdbc:
      initialize-schema: always # 스프링 배치 메타 테이블 자동 생성
  mail:
    host: smtp.gmail.com
    port: 587
    username: kbj961117@gmail.com  # 본인 Gmail 계정
    password: fzcj rtud ihdd fsjl   # 앱 비밀번호 (Google 계정 설정 -> 보안 -> 앱 비밀번호)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
